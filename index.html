<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La storia di Tommaso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#3a2412;--paper:#fff7e8;--red:#d6352b;--gold:#f4b63f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% 30%,#3b2a5e 0%,#1b1330 55%,#0d0918 100%);font-family:Nunito,system-ui,sans-serif;color:var(--ink);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
.stage{position:relative;width:min(96vw,calc((100vh - 90px) * 1.6));aspect-ratio:16/10;perspective:2600px}
@media (orientation:portrait){.stage{width:94vw;aspect-ratio:3/4.8;max-height:calc(100vh - 90px)}}
@media (max-width:560px){.lbl{display:none}.bar{gap:7px}.btn{min-width:42px;height:42px;padding:0 10px}#count{min-width:56px}}
.book{position:absolute;inset:0;transform-style:preserve-3d}
.page{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;
 transition:transform .95s cubic-bezier(.45,.05,.25,1),opacity 0s;cursor:pointer}
.page.turned{transform:rotateY(-178deg);opacity:0;pointer-events:none;
 transition:transform .95s cubic-bezier(.45,.05,.25,1),opacity .15s linear .8s}
.face{position:absolute;inset:0;border-radius:6px 18px 18px 6px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;
 box-shadow:inset 14px 0 22px -12px rgba(0,0,0,.45)}
.page.current .face.front,.page.turning .face{box-shadow:0 18px 45px rgba(0,0,0,.55),inset 14px 0 22px -12px rgba(0,0,0,.45)}
.page.far{display:none}
.back{transform:rotateY(180deg);background:linear-gradient(90deg,#efe1c4,var(--paper));border-radius:18px 6px 6px 18px}
.front{background:#222}
.front img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.02)}
.page.zoom1 .front img{transform:scale(1.28);transform-origin:60% 40%}
.page.current .front img{animation:kb 18s ease-in-out infinite alternate}
.page.zoom1.current .front img{animation:kb2 18s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.1)}}
@keyframes kb2{from{transform:scale(1.28)}to{transform:scale(1.38)}}
.spine{position:absolute;left:0;top:0;bottom:0;width:28px;background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(255,255,255,.12) 55%,transparent);pointer-events:none}
.chap{position:absolute;top:3.2%;left:4%;background:var(--red);color:#fff;font-family:Fredoka,sans-serif;font-weight:600;
 padding:.35em .9em;border-radius:999px;font-size:clamp(12px,1.7vw,19px);box-shadow:0 4px 12px rgba(0,0,0,.35);border:3px solid #fff;max-width:85%}
.chap b{color:var(--gold);margin-right:.35em}
.text{position:absolute;left:4%;right:4%;bottom:4%;max-height:52%;overflow:auto;background:rgba(255,247,232,.9);
 backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);border-radius:18px;padding:clamp(10px,1.6vw,22px) clamp(14px,2.2vw,30px);
 font-size:clamp(14px,1.75vw,23px);line-height:1.42;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.35);border:3px solid rgba(255,255,255,.8)}
.text p+p{margin-top:.35em}
.text .dlg{color:#7a2a12;font-style:italic}
.text .boom{font-family:Fredoka,sans-serif;font-weight:700;color:var(--red);letter-spacing:.04em;font-size:1.15em}
@media (orientation:portrait){.text{max-height:58%;font-size:clamp(14px,4vw,20px)}.chap{font-size:clamp(12px,3.4vw,17px)}}
/* cover */
.cover .front img{filter:saturate(1.1) brightness(.85)}
.cover-t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6%;text-align:center;background:linear-gradient(180deg,rgba(20,8,30,.65),transparent 55%)}
.cover-t h1{font-family:Fredoka,sans-serif;font-weight:700;color:#fff;font-size:clamp(30px,6.4vw,80px);line-height:1;text-shadow:0 4px 0 var(--red),0 8px 24px rgba(0,0,0,.6)}
.cover-t h2{margin-top:.5em;font-family:Fredoka,sans-serif;font-weight:500;color:var(--gold);font-size:clamp(14px,2.3vw,28px);text-shadow:0 2px 8px rgba(0,0,0,.8)}
.cover-t .tap{position:absolute;bottom:6%;color:#fff;background:var(--red);border:3px solid #fff;border-radius:999px;padding:.45em 1.2em;font-family:Fredoka;font-size:clamp(13px,1.8vw,20px);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.end .front{background:radial-gradient(circle at 50% 45%,#fff7e8,#f1d9a8)}
.end-t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.4em}
.end-t .big{font-family:Fredoka;font-weight:700;color:var(--red);font-size:clamp(34px,7vw,90px)}
.end-t .gem{width:clamp(60px,10vw,120px);aspect-ratio:1;background:radial-gradient(circle at 35% 30%,#ffd0c8,#ff3b2f 40%,#8d0d0d);clip-path:polygon(50% 0,100% 35%,80% 100%,20% 100%,0 35%);animation:glow 2.2s ease-in-out infinite;filter:drop-shadow(0 0 18px #ff3b2f)}
@keyframes glow{50%{filter:drop-shadow(0 0 40px #ff6a4a);transform:scale(1.06)}}
.end-t button{margin-top:.6em}
/* bar */
.bar{position:relative;z-index:100;margin-top:14px;display:flex;align-items:center;gap:10px;color:#f6e7c8;font-family:Fredoka;font-size:16px}
.btn{font-family:Fredoka;font-weight:600;border:3px solid #fff;background:var(--red);color:#fff;border-radius:999px;min-width:46px;height:46px;padding:0 14px;font-size:20px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.btn:disabled{opacity:.35;cursor:default}
.btn.soft{background:rgba(255,255,255,.12);font-size:16px}
.btn.on{background:var(--gold);color:var(--ink)}
#count{min-width:72px;text-align:center}
.menu{position:fixed;inset:0;background:rgba(10,6,20,.85);display:none;align-items:center;justify-content:center;z-index:50}
.menu.open{display:flex}
.menu .box{background:var(--paper);border-radius:22px;padding:22px;max-width:min(720px,92vw);max-height:84vh;overflow:auto;border:4px solid #fff}
.menu h3{font-family:Fredoka;color:var(--red);font-size:26px;margin-bottom:10px}
.menu ol{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.menu li{display:flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:6px;cursor:pointer;font-weight:800;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.menu li img{width:64px;height:40px;object-fit:cover;border-radius:8px}
.menu li:hover{outline:3px solid var(--gold)}
</style>
</head>
<body>
<div class="stage"><div class="book" id="book"></div></div>
<div class="bar">
  <button class="btn" id="prev" aria-label="Pagina precedente">◀</button>
  <span id="count"></span>
  <button class="btn" id="next" aria-label="Pagina successiva">▶</button>
  <button class="btn soft" id="idx" title="Capitoli">📖<span class="lbl"> Capitoli</span></button>
  <button class="btn soft" id="read" title="Leggi ad alta voce">🔊<span class="lbl"> Leggi</span></button>
  <button class="btn soft" id="fs" title="Schermo intero">⛶</button>
</div>
<div class="menu" id="menu"><div class="box"><h3>I capitoli</h3><ol id="list"></ol></div></div>
<script>
const PAGES = [{"img": "img/01.jpg", "ch": 1, "title": "Una gemma misteriosa", "p": ["Era un pomeriggio tranquillo nel giardino di casa. Tommaso giocava sotto il grande albero, mentre papà Marco e mamma Geggy erano seduti poco lontano. La piccola Sophie dormiva beata nella sua carrozzina.", "All’improvviso, tra le radici dell’albero, Tommaso vide qualcosa brillare."], "zoom": 0}, {"img": "img/02.jpg", "ch": null, "title": null, "p": ["«Papà! Mamma! Venite a vedere!»", "Era una gemma rossa, luminosa come il fuoco e brillante come mille stelle. Sembrava pulsare lentamente, quasi avesse un cuore."], "zoom": 0}, {"img": "img/03.jpg", "ch": null, "title": null, "p": ["Tommaso la raccolse.", "In quel momento, una luce rossa avvolse il giardino. L’aria cominciò a girare vorticosamente e davanti a loro si aprì un enorme portale.", "Dall’altra parte si intravedevano montagne, foreste gigantesche e creature che nessuno aveva mai visto."], "zoom": 0}, {"img": "img/04.jpg", "ch": null, "title": null, "p": ["«Tommaso, lascia quella pietra!» gridò papà Marco.", "Ma era troppo tardi.", "La gemma aveva aperto un passaggio verso un altro mondo."], "zoom": 0}, {"img": "img/05.jpg", "ch": 2, "title": "Il mondo dei dinosauri", "p": ["Un lampo rosso!", "La famiglia venne risucchiata nel portale e atterrò su un prato enorme, circondato da alberi giganteschi.", "Il cielo era pieno di pterodattili. In lontananza, enormi dinosauri camminavano tra le montagne."], "zoom": 0}, {"img": "img/05.jpg", "ch": null, "title": null, "p": ["Tommaso spalancò gli occhi.", "«MAMMA! PAPÀ! CI SONO I DINOSAURI!»", "Un gigantesco brontosauro passò lentamente sopra di loro, facendo tremare il terreno.", "Mamma Geggy abbracciò Sophie."], "zoom": 1}, {"img": "img/06.jpg", "ch": null, "title": null, "p": ["«Va bene, amore. Restiamo tutti insieme.»", "Papà Marco si guardò intorno.", "«Dobbiamo capire dove siamo e come tornare a casa.»", "Tommaso osservò la gemma rossa.", "Era ancora luminosa, ma il portale era scomparso.", "La pietra aveva un solo potere: trasportare le persone da un mondo all’altro.", "E senza di essa, non sarebbero mai potuti tornare a casa."], "zoom": 0}, {"img": "img/07.jpg", "ch": 3, "title": "Il nuovo amico Blu", "p": ["Mentre camminavano nella foresta, sentirono un rumore tremendo.", "THUMP! THUMP! THUMP!", "Le foglie tremavano. Gli alberi si muovevano.", "«È un dinosauro!» sussurrò Tommaso.", "Da dietro una montagna apparve un gigantesco T-Rex blu.", "Tommaso si nascose dietro papà Marco.", "Il dinosauro spalancò la bocca e ruggì:", "ROOOOOAAAAAR!", "Ma poi abbassò la testa e annusò Tommaso."], "zoom": 0}, {"img": "img/08.jpg", "ch": null, "title": null, "p": ["Il piccolo gli allungò lentamente la mano.", "Il T-Rex gli diede un leggerissimo colpetto con il muso.", "Tommaso scoppiò a ridere.", "«È buono!»", "Il dinosauro si chiamava Blu.", "Blu era un T-Rex speciale. Era enorme, fortissimo e velocissimo, ma aveva un cuore gentile.", "Da quel momento, diventò il loro amico e protettore."], "zoom": 0}, {"img": "img/09.jpg", "ch": 4, "title": "La foresta dei dinosauri", "p": ["Blu accompagnò la famiglia attraverso una foresta piena di meraviglie.", "Tommaso vide dinosauri di ogni tipo.", "Piccoli velociraptor correvano tra i cespugli. Triceratopi mangiavano foglie. Enormi diplodocus si muovevano lentamente tra gli alberi."], "zoom": 0}, {"img": "img/16.jpg", "ch": null, "title": null, "p": ["Mamma Geggy era bravissima a orientarsi."], "zoom": 0}, {"img": "img/19.jpg", "ch": null, "title": null, "p": ["«Dobbiamo cercare un posto alto. Da lì forse riusciremo a vedere dove si trova la gemma.»"], "zoom": 0}, {"img": "img/20.jpg", "ch": null, "title": null, "p": ["Papà Marco aiutava Tommaso a salire sulle rocce e a superare i tronchi caduti.", "Ma improvvisamente…", "Un’ombra gigantesca passò sopra di loro."], "zoom": 0}, {"img": "img/10.jpg", "ch": null, "title": null, "p": ["Un pterodattilo nero, con ali enormi e occhi cattivi, stava volando sopra la foresta.", "Aveva visto Sophie."], "zoom": 0}, {"img": "img/11.jpg", "ch": 5, "title": "Il rapimento di Sophie", "p": ["Lo pterodattilo piombò dal cielo.", "Con un colpo delle sue gigantesche ali sollevò un vortice di polvere e foglie.", "Mamma Geggy cercò di proteggere Sophie, ma il dinosauro afferrò la piccola con i suoi artigli e volò via!"], "zoom": 0}, {"img": "img/11.jpg", "ch": null, "title": null, "p": ["«SOPHIE!» urlò mamma.", "Papà Marco corse verso il dinosauro.", "Tommaso gridò:", "«LASCIATE LA MIA SORELLINA!»", "Lo pterodattilo stringeva Sophie tra gli artigli e volava verso una montagna rocciosa."], "zoom": 1}, {"img": "img/12.jpg", "ch": null, "title": null, "p": ["La gemma rossa, che Tommaso aveva in mano, brillò intensamente.", "Ma lo pterodattilo si voltò improvvisamente e, con un colpo di coda, la fece cadere.", "La gemma rotolò tra le rocce.", "Lo pterodattilo era riuscito a rubare Sophie.", "E senza la gemma, la famiglia era intrappolata nel mondo dei dinosauri."], "zoom": 0}, {"img": "img/13.jpg", "ch": 6, "title": "La montagna dello pterodattilo", "p": ["Lo pterodattilo volò verso una montagna altissima.", "Sulla cima c’era un nido gigantesco, dove vivevano i suoi piccoli.", "Il dinosauro era cattivo e voleva dare Sophie in pasto ai suoi piccoli.", "Tommaso, papà Marco e mamma Geggy decisero di inseguirlo."], "zoom": 0}, {"img": "img/14.jpg", "ch": null, "title": null, "p": ["Blu abbassò la testa.", "«ROOOAR!»", "Era pronto a portarli sulla montagna.", "Mamma Geggy trovò un sentiero nascosto tra le rocce.", "Papà Marco si arrampicò per primo, aiutando Tommaso."], "zoom": 0}, {"img": "img/15.jpg", "ch": null, "title": null, "p": ["Ma il sentiero era pericolosissimo.", "Pietre rotolavano sotto i loro piedi e il vento soffiava fortissimo.", "Mamma Geggy, però, non si fermò.", "«Sophie ha bisogno di noi!»", "E continuò a salire."], "zoom": 0}, {"img": "img/17.jpg", "ch": 7, "title": "La battaglia contro lo pterodattilo", "p": ["Finalmente arrivarono vicino al nido.", "Lo pterodattilo li vide e lanciò un ruggito terrificante.", "KRAAAAA!", "Le sue ali gigantesche si aprirono e si lanciò contro di loro.", "Papà Marco si mise davanti a Tommaso.", "Mamma Geggy afferrò un ramo robusto e lo usò per proteggersi dagli artigli."], "zoom": 0}, {"img": "img/18.jpg", "ch": null, "title": null, "p": ["Lo pterodattilo attaccò ancora.", "Papà Marco riuscì a schivarlo all’ultimo momento, ma venne spinto contro una roccia.", "Tommaso vide Sophie nel nido.", "Era spaventata, ma stava bene.", "«SOPHIE! ARRIVO!»", "Mamma Geggy fece una cosa incredibile.", "Aspettò che lo pterodattilo si lanciasse contro di lei e, all’ultimo secondo, si spostò."], "zoom": 0}, {"img": "img/25.jpg", "ch": null, "title": null, "p": ["Il dinosauro colpì una grande roccia con le ali.", "BOOOOM!", "Per qualche secondo rimase stordito.", "Papà Marco si rialzò.", "«Tommaso! Adesso!»", "Tommaso corse verso il nido.", "Ma lo pterodattilo tornò all’attacco."], "zoom": 0}, {"img": "img/23.jpg", "ch": 8, "title": "Tommaso, il piccolo eroe", "p": ["Lo pterodattilo si lanciò contro Tommaso.", "Il piccolo si abbassò e si aggrappò a una liana.", "La liana oscillò sopra il nido.", "Tommaso saltò!", "Atterrò proprio vicino a Sophie.", "La prese delicatamente tra le braccia."], "zoom": 0}, {"img": "img/26.jpg", "ch": null, "title": null, "p": ["«Ti ho trovata, sorellina!»", "Lo pterodattilo ruggì furiosamente.", "Tommaso vide una grande roccia vicino al nido.", "Aspettò che il dinosauro si avvicinasse.", "Poi gridò:"], "zoom": 0}, {"img": "img/24.jpg", "ch": null, "title": null, "p": ["«BLU! ADESSO!»", "Blu arrivò correndo e colpì la montagna con la sua gigantesca testa.", "Una pioggia di rocce cadde davanti allo pterodattilo.", "Il dinosauro perse l’equilibrio, batté le ali e precipitò su una piattaforma rocciosa più in basso."], "zoom": 0}, {"img": "img/21.jpg", "ch": null, "title": null, "p": ["Papà Marco e mamma Geggy raggiunsero Tommaso.", "La famiglia era finalmente riunita.", "Tommaso aveva salvato Sophie!"], "zoom": 0}, {"img": "img/28.jpg", "ch": 9, "title": "La gemma cade dalla montagna", "p": ["Ma proprio mentre stavano festeggiando…", "Un forte terremoto scosse la montagna.", "La gemma rossa, che si trovava su una roccia poco distante, cominciò a tremare.", "CRACK!", "La roccia si spezzò.", "La gemma cadde lungo il fianco della montagna.", "Rimbalzò tra le rocce."], "zoom": 0}, {"img": "img/22.jpg", "ch": null, "title": null, "p": ["TINK! TINK! TINK!", "E finì in una valle profonda.", "Tommaso la vide.", "«LA GEMMA!»", "Senza la gemma, non potevano tornare a casa.", "La famiglia doveva raggiungerla.", "Ma il cielo diventò improvvisamente scuro.", "Dalla montagna si alzò una gigantesca nube di fumo."], "zoom": 0}, {"img": "img/29.jpg", "ch": 10, "title": "Il vulcano si risveglia", "p": ["Il vulcano, che fino a quel momento sembrava dormire, cominciò a eruttare.", "BOOOOOOM!", "Lava rossa uscì dal cratere.", "Le rocce incandescenti volavano nel cielo.", "La terra tremava.", "Papà Marco prese Sophie.", "Mamma Geggy afferrò Tommaso."], "zoom": 0}, {"img": "img/29.jpg", "ch": null, "title": null, "p": ["«CORRIAMO!»", "Ma il sentiero era bloccato.", "La lava avanzava rapidamente.", "Blu ruggì disperatamente.", "Poi fece qualcosa di incredibile.", "Si voltò verso la foresta e lanciò un gigantesco richiamo.", "ROOOOOAAAAAAR!"], "zoom": 1}, {"img": "img/30.jpg", "ch": 11, "title": "Gli amici T-Rex", "p": ["Dalla foresta arrivarono altri T-Rex.", "Uno dopo l’altro.", "Erano enormi, forti e veloci.", "Blu aveva chiamato i suoi amici!", "Il primo T-Rex si abbassò.", "Tommaso salì sulla sua schiena.", "Papà Marco salì su un altro.", "Mamma Geggy salì sul terzo, tenendo Sophie stretta tra le braccia.", "«Tenetevi forte!» gridò papà."], "zoom": 0}, {"img": "img/31.jpg", "ch": null, "title": null, "p": ["I T-Rex partirono.", "Correvano attraverso la foresta, saltando tronchi, attraversando fiumi e schivando rocce incandescenti.", "La lava li inseguiva.", "Dietro di loro, gli alberi prendevano fuoco.", "Il cielo era pieno di cenere.", "Tommaso si aggrappò a Blu.", "«VAI BLU! VAI!»"], "zoom": 0}, {"img": "img/32.jpg", "ch": 12, "title": "La corsa contro la lava", "p": ["La lava raggiunse il sentiero.", "Un enorme fiume rosso tagliò la strada davanti a loro.", "I T-Rex si fermarono.", "Papà Marco guardò la montagna.", "«Non possiamo tornare indietro!»", "Mamma Geggy vide un ponte naturale tra due rocce.", "«LÀ!»", "I dinosauri cambiarono direzione.", "Blu saltò per primo.", "Il terreno tremò sotto le sue zampe."], "zoom": 0}, {"img": "img/32.jpg", "ch": null, "title": null, "p": ["Un altro T-Rex saltò dietro di lui.", "Poi un altro.", "La famiglia volava sulle schiene dei dinosauri sopra un precipizio.", "La lava passò sotto di loro.", "Tommaso chiuse gli occhi.", "Quando li riaprì, erano dall’altra parte.", "Ma la gemma era ancora lontana."], "zoom": 1}, {"img": "img/33.jpg", "ch": 13, "title": "La gemma rossa", "p": ["Finalmente raggiunsero la valle.", "La gemma rossa brillava tra le rocce, vicino a un fiume di lava.", "Tommaso scese da Blu.", "«Ci penso io!»", "Papà Marco lo aiutò a raggiungere la roccia.", "Mamma Geggy rimase con Sophie, ma vide che il terreno sotto Tommaso stava cedendo.", "«TOMMASO! ATTENTO!»"], "zoom": 0}, {"img": "img/27.jpg", "ch": null, "title": null, "p": ["Una crepa si aprì.", "Tommaso rischiò di cadere.", "Papà Marco si lanciò e lo afferrò per la mano.", "Mamma Geggy, con un coraggio incredibile, si avvicinò e riuscì a tirare entrambi verso una zona sicura.", "Tommaso raggiunse la gemma.", "La prese.", "La pietra rossa brillò come il sole."], "zoom": 0}, {"img": "img/34.jpg", "ch": 14, "title": "Il portale di ritorno", "p": ["La gemma cominciò a pulsare.", "Una luce rossa si espanse intorno alla famiglia.", "Tommaso la strinse forte.", "«VOGLIO TORNARE A CASA!»", "Il cielo si aprì.", "Apparve un gigantesco portale luminoso.", "Dall’altra parte si vedeva il loro giardino.", "Il grande albero.", "Il prato.", "La casa.", "Papà Marco prese Tommaso per mano."], "zoom": 0}, {"img": "img/34.jpg", "ch": null, "title": null, "p": ["Mamma Geggy abbracciò Sophie.", "Blu ruggì.", "Gli altri T-Rex salutarono la famiglia.", "Tommaso si voltò.", "«Grazie, Blu! Non ti dimenticherò mai!»", "Blu abbassò la testa e diede a Tommaso un ultimo colpetto affettuoso.", "La famiglia attraversò il portale."], "zoom": 1}, {"img": "img/35.jpg", "ch": 15, "title": "Tutti al sicuro", "p": ["Un lampo.", "E la famiglia era di nuovo nel giardino di casa.", "Il sole stava tramontando.", "Il grande albero era esattamente come prima.", "Tommaso guardò papà Marco.", "Poi mamma Geggy.", "Poi Sophie.", "Erano tutti insieme.", "Tutti al sicuro.", "La gemma rossa si spense lentamente."], "zoom": 0}, {"img": "img/35.jpg", "ch": null, "title": null, "p": ["Tommaso la mise sul tavolino del salotto.", "Quella sera, la famiglia si sedette sul grande divano beige.", "Papà Marco abbracciò Tommaso.", "Mamma Geggy tenne Sophie tra le braccia.", "Tommaso si rannicchiò vicino a loro."], "zoom": 1}, {"img": "img/36.jpg", "ch": null, "title": null, "p": ["«È stata l’avventura più bella della mia vita!»", "Papà Marco sorrise.", "«E il nostro piccolo eroe ha salvato tutti.»", "Mamma Geggy gli diede un bacio.", "«Siamo molto orgogliosi di te.»", "Tommaso guardò Sophie.", "«La prossima volta ti porto con me… ma niente pterodattili cattivi!»"], "zoom": 0}, {"img": "img/36.jpg", "ch": null, "title": null, "p": ["Tutti scoppiarono a ridere.", "La gemma rossa brillò per un istante.", "Solo un piccolo lampo.", "Come se stesse dicendo:", "“La prossima avventura non è ancora finita…”"], "zoom": 1}];
const book=document.getElementById('book');
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function fmt(paras){
  // raggruppa le frasi narrative consecutive in un unico paragrafo; dialoghi e "suoni" su riga propria
  const out=[];let buf=[];
  const flush=()=>{if(buf.length){out.push('<p>'+buf.map(esc).join(' ')+'</p>');buf=[]}};
  for(const p of paras){
    const isBoom=/^[A-ZÀ-Ù!’' ]{4,}$/.test(p.replace(/[«»]/g,''))&&!p.startsWith('«');
    if(p.startsWith('«')){flush();out.push('<p class="dlg">'+esc(p)+'</p>')}
    else if(isBoom){flush();out.push('<p class="boom">'+esc(p)+'</p>')}
    else buf.push(p);
  }
  flush();return out.join('');
}
const els=[];
function addPage(html,cls=''){
  const d=document.createElement('div');d.className='page '+cls;
  d.innerHTML='<div class="face front">'+html+'<div class="spine"></div></div><div class="face back"></div>';
  book.appendChild(d);els.push(d);return d;
}
addPage('<img src="img/03.jpg" alt=""><div class="cover-t"><h1>La storia<br>di Tommaso</h1><h2>La gemma rossa e il mondo dei dinosauri</h2><span class="tap">Tocca per iniziare ▶</span></div>','cover');
const chapters=[];
PAGES.forEach(pg=>{
  let h='<img src="'+pg.img+'" alt="" loading="lazy">';
  if(pg.ch){h+='<div class="chap"><b>Capitolo '+pg.ch+'</b>'+esc(pg.title)+'</div>';chapters.push({n:pg.ch,t:pg.title,img:pg.img,i:els.length})}
  h+='<div class="text">'+fmt(pg.p)+'</div>';
  const d=addPage(h,pg.zoom?'zoom1':'');d._say=pg.p.join(' ');
});
addPage('<div class="end-t"><div class="gem"></div><div class="big">Fine… per ora!</div><div style="font-weight:800;font-size:clamp(14px,2vw,22px)">🦖 La prossima avventura non è ancora finita… ❤️</div><button class="btn" id="again">↺ Ricomincia</button></div>','end');
const N=els.length;
els.forEach((e,i)=>e.style.zIndex=N-i);
let cur=0;
try{const s=parseInt(localStorage.getItem('storia-tommaso-pag'));if(s>0&&s<N)cur=s}catch(e){}
function render(){
  els.forEach((e,i)=>{const far=i<cur-1||i>cur+1;
    if(e.classList.contains('turned')!==(i<cur)&&!far){e.classList.add('turning');setTimeout(()=>e.classList.remove('turning'),1000)}
    e.classList.toggle('far',far);e.classList.toggle('turned',i<cur);e.classList.toggle('current',i===cur)});
  document.getElementById('count').textContent=(cur+1)+' / '+N;
  document.getElementById('prev').disabled=cur===0;
  document.getElementById('next').disabled=cur===N-1;
  try{localStorage.setItem('storia-tommaso-pag',cur)}catch(e){}
  // precarica le immagini vicine
  for(let k=cur;k<cur+3&&k<N;k++){const im=els[k].querySelector('img');if(im)im.loading='eager'}
  if(reading)speak();
}
function go(n){n=Math.max(0,Math.min(N-1,n));if(n===cur)return;cur=n;render()}
const next=()=>go(cur+1),prev=()=>go(cur-1);
document.getElementById('next').onclick=next;
document.getElementById('prev').onclick=prev;
book.addEventListener('click',e=>{
  if(e.target.closest('button')||e.target.closest('.text')&&e.target.closest('.text').scrollHeight>e.target.closest('.text').clientHeight+4)return;
  const r=book.getBoundingClientRect();(e.clientX-r.left<r.width*0.3)?prev():next();
});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')next();if(e.key==='ArrowLeft')prev();if(e.key==='Escape')menu.classList.remove('open')});
let tx=null,ty=null;
book.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
book.addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)){dx<0?next():prev();e.preventDefault()}tx=null},{passive:false});
document.getElementById('again').onclick=e=>{e.stopPropagation();go(0)};
// indice
const menu=document.getElementById('menu'),list=document.getElementById('list');
chapters.forEach(c=>{const li=document.createElement('li');li.innerHTML='<img src="'+c.img+'" alt=""><span>'+c.n+'. '+esc(c.t)+'</span>';li.onclick=()=>{menu.classList.remove('open');go(c.i)};list.appendChild(li)});
document.getElementById('idx').onclick=()=>menu.classList.add('open');
menu.onclick=e=>{if(e.target===menu)menu.classList.remove('open')};
// lettura ad alta voce
let reading=false;const rb=document.getElementById('read');
const synth=window.speechSynthesis;
if(!synth)rb.style.display='none';
function speak(){try{synth.cancel();const t=els[cur]._say||(cur===0?'La storia di Tommaso. La gemma rossa e il mondo dei dinosauri.':'Fine, per ora!');
  const u=new SpeechSynthesisUtterance(t.replace(/[«»]/g,''));u.lang='it-IT';u.rate=.92;
  const v=synth.getVoices().find(v=>v.lang&&v.lang.startsWith('it'));if(v)u.voice=v;synth.speak(u)}catch(e){}}
rb.onclick=()=>{reading=!reading;rb.classList.toggle('on',reading);if(reading)speak();else try{synth.cancel()}catch(e){}};
document.getElementById('fs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}};
render();
</script>
</body>
</html>
