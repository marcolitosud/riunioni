<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le storie di Tommaso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#3a2412;--paper:#fff7e8;--red:#d6352b;--gold:#f4b63f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:radial-gradient(ellipse at 50% 30%,#3b2a5e 0%,#1b1330 55%,#0d0918 100%);font-family:Nunito,system-ui,sans-serif;color:var(--ink);
 min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4vh 4vw;gap:4vh}
h1{font-family:Fredoka,sans-serif;font-weight:700;color:#fff;font-size:clamp(34px,6vw,72px);text-align:center;line-height:1;text-shadow:0 4px 0 var(--red),0 8px 24px rgba(0,0,0,.6)}
h1 .gem{display:inline-block;width:.75em;aspect-ratio:1;margin:0 .15em;vertical-align:-.05em;background:radial-gradient(circle at 35% 30%,#ffd0c8,#ff3b2f 40%,#8d0d0d);clip-path:polygon(50% 0,100% 35%,80% 100%,20% 100%,0 35%);animation:glow 2.2s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 30px #ff6a4a);transform:scale(1.08)}}
.sub{color:var(--gold);font-family:Fredoka;font-size:clamp(16px,2.2vw,24px);text-align:center;margin-top:-2vh}
.books{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(420px,90vw),1fr));gap:4vw;width:min(1200px,92vw)}
a.book{display:block;text-decoration:none;color:inherit;background:var(--paper);border-radius:10px 24px 24px 10px;overflow:hidden;border:4px solid #fff;
 box-shadow:0 18px 45px rgba(0,0,0,.55),inset 14px 0 22px -12px rgba(0,0,0,.45);transition:transform .25s}
a.book:hover,a.book:focus{transform:translateY(-6px) rotate(-1deg);outline:none}
.cov{position:relative;aspect-ratio:16/10;overflow:hidden}
.cov img{width:100%;height:100%;object-fit:cover;display:block}
.num{position:absolute;top:12px;left:12px;background:var(--red);color:#fff;border:3px solid #fff;border-radius:999px;padding:.25em .9em;font-family:Fredoka;font-weight:600;font-size:clamp(13px,1.6vw,18px)}
.info{padding:16px 20px 20px;text-align:center}
.info h2{font-family:Fredoka;font-weight:700;color:var(--red);font-size:clamp(24px,3vw,36px);line-height:1.05}
.info p{font-weight:800;color:#7a4a22;margin-top:.3em;font-size:clamp(14px,1.7vw,19px)}
.go{display:inline-block;margin-top:12px;color:#fff;background:var(--red);border:3px solid #fff;border-radius:999px;padding:.4em 1.3em;font-family:Fredoka;font-weight:600;font-size:clamp(15px,1.8vw,20px);box-shadow:0 4px 12px rgba(0,0,0,.25)}
</style>
</head>
<body>
<h1>Le storie<span class="gem"></span>di Tommaso</h1>
<p class="sub">Scegli l’avventura da leggere</p>
<div class="books">
  <a class="book" href="storia1/">
    <div class="cov"><img src="storia1/img/s02.jpg" alt=""><span class="num">Avventura 1</span></div>
    <div class="info"><h2>La storia di Tommaso</h2><p>La gemma rossa e il mondo dei dinosauri</p><span class="go">Leggi ▶</span></div>
  </a>
  <a class="book" href="storia2/">
    <div class="cov"><img src="storia2/img/s1.jpg" alt=""><span class="num">Avventura 2</span></div>
    <div class="info"><h2>Tommaso e Blu</h2><p>La sfida degli Indominus Rex</p><span class="go">Leggi ▶</span></div>
  </a>
</div>
</body>
</html>
